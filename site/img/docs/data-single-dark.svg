<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img">
<title>Where your data lives on one machine</title>
<desc>On one machine, maple-proxy writes one usage file per day into the usage folder of its config folder: that is the default and all most people need. Three optional extras are made from those files: monthly Parquet files, one DuckDB file, or a DuckLake with its catalog and data files on the same machine; the lake keeps days the daily files no longer have. usage query and the setup page read the daily files; DuckDB reads any of them. Prompts and answers are never written anywhere.</desc>
<style>.sans{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}</style>
<defs><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E4572E"/></marker><marker id="h-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6FB6C4"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B9ABA3"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8CC17A"/></marker></defs>
<rect width="960" height="500" fill="#1B1513"/>
<text x="30" y="36" font-size="13" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">Your machine</text>
<text x="392" y="36" font-size="13" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">Kept on disk</text>
<text x="742" y="36" font-size="13" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">What reads it</text>
<rect x="30" y="56" width="290" height="110" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="46" y="84" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">maple-proxy</text>
<text x="46" y="108" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">one line per request</text>
<text x="46" y="129" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">counts and labels only,</text>
<text x="46" y="150" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">never prompts or answers</text>
<path d="M320 111 L390 111" fill="none" stroke="#E4572E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-accent)"/>
<rect x="392" y="56" width="310" height="110" rx="12" fill="#3A221A" stroke="#E4572E" stroke-width="2"/>
<text x="410" y="84" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">Daily files</text>
<rect x="610" y="68" width="74" height="24.5" rx="12.25" fill="#3A221A" stroke="#E4572E" stroke-width="1"/>
<text x="647" y="83.5" font-size="12.5" fill="#E4572E" font-weight="600" text-anchor="middle" class="sans">default</text>
<text x="410" y="110" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">usage/  one .jsonl a day</text>
<text x="410" y="134" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">kept 90 days unless you change it</text>
<text x="392" y="204" font-size="13.5" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">Optional, made from the daily files:</text>
<rect x="392" y="220" width="310" height="62" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="410" y="246" font-size="15" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">Monthly Parquet</text>
<text x="410" y="268" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">usage compact</text>
<text x="690" y="268" font-size="12.5" fill="#B9ABA3" font-weight="400" text-anchor="end" class="sans">removed with their days</text>
<rect x="392" y="296" width="310" height="62" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="410" y="322" font-size="15" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">One DuckDB file</text>
<text x="410" y="344" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">usage duckdb</text>
<text x="690" y="344" font-size="12.5" fill="#B9ABA3" font-weight="400" text-anchor="end" class="sans">follows the daily files</text>
<rect x="392" y="372" width="310" height="62" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="410" y="398" font-size="15" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">A local DuckLake</text>
<text x="410" y="420" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">usage lake</text>
<text x="690" y="420" font-size="12.5" fill="#B9ABA3" font-weight="400" text-anchor="end" class="sans">keeps everything it was given</text>
<path d="M547 166 L547 196" fill="none" stroke="#B9ABA3" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-muted)"/>
<rect x="742" y="56" width="190" height="76" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="758" y="84" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">usage query</text>
<text x="758" y="108" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">in the terminal</text>
<rect x="742" y="166" width="190" height="76" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="758" y="194" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">The setup page</text>
<text x="758" y="218" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">Usage and Data tabs</text>
<rect x="742" y="276" width="190" height="76" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="758" y="304" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">DuckDB</text>
<text x="758" y="328" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">plain SQL, any of them</text>
<path d="M702 96 L742 94" fill="none" stroke="#B9ABA3" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-muted)"/>
<path d="M702 130 L742 204" fill="none" stroke="#B9ABA3" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-muted)"/>
<path d="M702 327 L742 316" fill="none" stroke="#B9ABA3" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-muted)"/>
<text x="480" y="482" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="middle" class="sans">Nothing leaves your machine unless you send it somewhere yourself.</text>
</svg>
