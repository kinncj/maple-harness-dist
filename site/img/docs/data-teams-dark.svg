<text x="46" y="84" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">maple-proxy</text>
<text x="46" y="108" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">copy 1 of the same proxy</text>
<path d="M280 89 L340 141" fill="none" stroke="#E4572E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-accent)"/>
