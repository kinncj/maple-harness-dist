<text x="342" y="36" font-size="13" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">Live data</text>
<text x="672" y="36" font-size="13" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">History</text>
