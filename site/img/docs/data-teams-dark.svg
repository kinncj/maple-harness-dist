<text x="46" y="194" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">copy 2 of the same proxy</text>
<path d="M280 175 L340 141" fill="none" stroke="#E4572E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-accent)"/>
<rect x="30" y="228" width="250" height="66" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="46" y="256" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">maple-proxy</text>
<text x="46" y="280" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">copy 3 of the same proxy</text>
<path d="M280 261 L340 141" fill="none" stroke="#E4572E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-accent)"/>
<rect x="30" y="330" width="250" height="66" rx="12" fill="#211A17" stroke="#54453F" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="48" y="358" font-size="15" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">Redis</text>
<text x="48" y="380" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">sessions and caches, no usage</text>
<rect x="342" y="56" width="260" height="190" rx="12" fill="#3A221A" stroke="#E4572E" stroke-width="2"/>
<text x="362" y="86" font-size="17" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">PostgreSQL</text>
<text x="362" y="112" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">every copy&#x27;s usage and events</text>
<text x="362" y="136" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">budgets, people, settings</text>
<text x="362" y="172" font-size="13.5" fill="#F2E9E4" font-weight="400" text-anchor="start" class="sans">keeps the recent days:</text>
<text x="362" y="194" font-size="13.5" fill="#F2E9E4" font-weight="400" text-anchor="start" class="mono">storage.retention_days</text>
<text x="362" y="226" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">default: 90</text>
<path d="M602 141 L670 141" fill="none" stroke="#6FB6C4" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#h-down)"/>
<rect x="672" y="56" width="260" height="260" rx="12" fill="#2A211E" stroke="#6FB6C4" stroke-width="2"/>
<text x="690" y="86" font-size="17" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">DuckLake</text>
<text x="690" y="112" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">the whole history</text>
<text x="690" y="146" font-size="13.5" fill="#F2E9E4" font-weight="600" text-anchor="start" class="sans">copied in once an hour</text>
<text x="690" y="180" font-size="13.5" fill="#F2E9E4" font-weight="600" text-anchor="start" class="sans">catalog:</text>
<text x="690" y="202" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">a schema in PostgreSQL</text>
<text x="690" y="236" font-size="13.5" fill="#F2E9E4" font-weight="600" text-anchor="start" class="sans">data files:</text>
<text x="690" y="258" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">Parquet on a volume or in S3</text>
<text x="690" y="294" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">never deleted by the copy</text>
<rect x="342" y="420" width="590" height="76" rx="12" fill="#211A17" stroke="#54453F" stroke-width="1.5"/>
<text x="362" y="450" font-size="15" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">Analysts and dashboards</text>
<text x="362" y="474" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">DuckDB, read-only: PostgreSQL for the recent days, the lake for history</text>
<path d="M472 420 L472 248" fill="none" stroke="#B9ABA3" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-muted)"/>
<path d="M802 420 L802 318" fill="none" stroke="#B9ABA3" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#h-muted)"/>
</svg>
