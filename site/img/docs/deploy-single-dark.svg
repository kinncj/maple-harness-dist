<text x="738" y="184" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">Anthropic</text>
<text x="738" y="208" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">an API key</text>
<path d="M672 150 L722 194" fill="none" stroke="#B9ABA3" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-muted)"/>
<rect x="722" y="256" width="210" height="76" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="738" y="284" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">Model server</text>
<text x="738" y="308" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">Ollama, LM Studio</text>
<path d="M672 180 L722 294" fill="none" stroke="#B9ABA3" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#h-muted)"/>
<text x="480" y="362" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="middle" class="sans">One replica, files on one volume: the same proxy as on a machine.</text>
