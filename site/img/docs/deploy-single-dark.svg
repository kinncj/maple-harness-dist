<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img">
<title>One maple-proxy in a container</title>
<desc>Tools on your machine or network send requests with an access token to one maple-proxy container. Everything it keeps, its settings, access tokens, usage log and downloaded models, is on one volume mounted at /data, so it survives a restart or an upgrade. Provider keys and tokens come from mounted secrets. The proxy sends requests on to your providers and model servers.</desc>
<style>.sans{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}</style>
<defs><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E4572E"/></marker><marker id="h-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6FB6C4"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B9ABA3"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8CC17A"/></marker></defs>
<rect width="960" height="380" fill="#1B1513"/>
<text x="30" y="36" font-size="13" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">Your tools</text>
<text x="352" y="36" font-size="13" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">The container</text>
<text x="722" y="36" font-size="13" fill="#B9ABA3" font-weight="700" text-anchor="start" class="sans">Providers</text>
<rect x="30" y="56" width="240" height="76" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="46" y="84" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">Maple Harness</text>
<text x="46" y="108" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">token: laptop</text>
<path d="M270 94 L350 120" fill="none" stroke="#E4572E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-accent)"/>
<rect x="30" y="156" width="240" height="76" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="46" y="184" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">Claude Code</text>
<text x="46" y="208" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">token: laptop</text>
<path d="M270 194 L350 150" fill="none" stroke="#E4572E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-accent)"/>
<rect x="30" y="256" width="240" height="76" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="46" y="284" font-size="16" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">OpenCode</text>
<text x="46" y="308" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">token: ci</text>
<path d="M270 294 L350 180" fill="none" stroke="#E4572E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#h-accent)"/>
