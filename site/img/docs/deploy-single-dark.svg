<text x="372" y="88" font-size="18" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">maple-proxy</text>
<text x="372" y="112" font-size="13" fill="#B9ABA3" font-weight="400" text-anchor="start" class="mono">:11535 OpenAI   :11537 Anthropic</text>
<rect x="372" y="130" width="280" height="92" rx="12" fill="#2A211E" stroke="#54453F" stroke-width="1.5"/>
<text x="388" y="156" font-size="14" fill="#F2E9E4" font-weight="700" text-anchor="start" class="sans">volume /data</text>
<text x="388" y="180" font-size="13.5" fill="#B9ABA3" font-weight="400" text-anchor="start" class="sans">settings, access tokens,</text>
