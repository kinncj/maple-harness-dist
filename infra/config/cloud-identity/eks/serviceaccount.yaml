apiVersion: v1
kind: ServiceAccount
metadata:
  name: maple-proxy
  annotations:
    # The IAM role the proxy's requests to Amazon Bedrock run as. The EKS webhook gives the pod
    # AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE (a projected token of its own).
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/REPLACE-ME
# The Kubernetes API token is not needed: the webhook mounts a separate, projected token.
automountServiceAccountToken: false
