apiVersion: v1
kind: ServiceAccount
metadata:
  name: maple-proxy
  annotations:
    # The client id of the user-assigned managed identity that has access to the Azure OpenAI or
    # Foundry resource (Cognitive Services OpenAI User, or Azure AI User).
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
# The Kubernetes API token is not needed: the webhook mounts a separate, federated token.
automountServiceAccountToken: false
