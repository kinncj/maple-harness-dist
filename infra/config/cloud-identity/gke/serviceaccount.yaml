apiVersion: v1
kind: ServiceAccount
metadata:
  name: maple-proxy
  annotations:
    # Only when the role is granted to a Google service account rather than to this Kubernetes
    # service account directly; remove it otherwise.
    iam.gke.io/gcp-service-account: maple-proxy@REPLACE-ME.iam.gserviceaccount.com
automountServiceAccountToken: false
