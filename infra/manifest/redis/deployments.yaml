# FOR TRYING IT OUT: one Redis, memory only. Sessions and shared caches live here; losing it
# signs browsers out of the setup page and empties caches, nothing more. In production use your
# managed Redis (with a password and TLS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app.kubernetes.io/name: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:7
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis, key: password}}
          # The password goes into a config file in memory, never onto the command line (where a process
          # list on the node shows it).
          command: ["sh", "-c"]
          args:
            - >-
              REDIS_PASSWORD=$(printf '%s' "$REDIS_PASSWORD") && case "$REDIS_PASSWORD" in ''|*[!A-Za-z0-9._~+/=-]*) echo 'the Redis password must be letters, digits and ._~+/=- only' >&2; exit 1;; esac && umask 077 && printf 'requirepass "%s"\n' "$REDIS_PASSWORD" > /conf/redis.conf && unset REDIS_PASSWORD &&
              exec redis-server /conf/redis.conf --save '' --appendonly no --maxmemory 512mb --maxmemory-policy volatile-lru
          ports: [{name: redis, containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 640Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: conf, mountPath: /conf}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: conf, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
