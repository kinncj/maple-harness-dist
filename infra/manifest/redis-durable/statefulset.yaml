# One Redis that KEEPS what it holds, for storage mode redis (config/ha-redis), where it is the only
# store: usage, budgets, settings and tokens live here. The proxy refuses to start on a Redis without
# an append-only file or one that may evict keys, so both are set here, on a persistent volume.
#
# For trying it out: one Redis, no replica, no backups. In production use a Redis or Valkey that
# offers the same (appendonly yes, maxmemory-policy noeviction, a persistent disk) and back up its
# data folder (the appendonlydir) regularly; PostgreSQL and Redis together (config/ha-shared) stay
# the recommendation for several replicas.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: {app.kubernetes.io/name: redis}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:7
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis, key: password}}
          # appendonly yes + appendfsync everysec: at most about a second of writes lost on a crash.
          # noeviction: a full Redis refuses writes instead of deleting keys (the proxy then spools
          # usage lines and refuses budgeted requests); size maxmemory with room to spare.
          # The proxy signs in as the user "maple", which cannot run FLUSHALL, CONFIG, DEBUG,
          # SHUTDOWN or any other dangerous command (INFO stays: the proxy checks durability with
          # it); the default user is off. Add a user of your own for administration.
          args: ["--dir", "/data", "--appendonly", "yes", "--appendfsync", "everysec",
                 "--maxmemory", "1gb", "--maxmemory-policy", "noeviction",
                 "--user", "default", "off",
                 "--user", "maple", "on", ">$(REDIS_PASSWORD)", "~*", "&*", "+@all", "-@dangerous", "+info"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: ["sh", "-c", "redis-cli --user maple -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1280Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
