# maple-proxy: the base the overlays in config/ adjust (replicas, storage mode, volumes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maple-proxy
  labels: {app.kubernetes.io/name: maple-proxy}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: maple-proxy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: maple-proxy}
    spec:
      # Long enough for a running stream to finish after the replica stops taking new requests.
      terminationGracePeriodSeconds: 600
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: maple-proxy
          # Set with: kustomize edit set image maple-proxy=registry.example.com/you/maple-proxy:2.0.0
          image: maple-proxy
          args: ["serve"]
          ports:
            - {name: openai, containerPort: 11535}
            - {name: anthropic, containerPort: 11537}
          env:
            - name: MAPLE_PROXY_INSTANCE
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: MAPLE_PROXY_ID, value: maple-proxy}
            - {name: MAPLE_ALLOWED_HOSTS, value: "maple-proxy,maple-proxy.maple,maple-proxy.maple.svc,maple-proxy.maple.svc.cluster.local"}
            - {name: MAPLE_DRAIN_DELAY, value: 5s}
            - {name: MAPLE_SHUTDOWN_GRACE, value: 9m}
            - {name: MAPLE_EMBEDDINGS_DIR, value: /models}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: models, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
            - {name: secrets, mountPath: /run/secrets/maple, readOnly: true}
          startupProbe:
            httpGet: {path: /healthz, port: openai}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: openai}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: openai}
            periodSeconds: 5
          lifecycle:
            # Endpoints are removed while the replica still serves.
            preStop: {sleep: {seconds: 5}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          emptyDir: {}
        - name: models
          emptyDir: {}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        - name: secrets
          secret: {secretName: maple-proxy}
