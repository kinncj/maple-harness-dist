# EXAMPLE ONLY. Replace every REPLACE-ME before applying, or better, create the Secret from your
# secret manager. Each key is one file under /run/secrets/maple; the proxy reads them read-only.
#
#   access.proxy_tokens       label=token per line: the tokens clients use (proxy scope)
#   access.metrics_tokens     optional, label=token per line: scrapers of /metrics (metrics scope)
#   storage.postgres_dsn      central mode: postgres://user:password@host:5432/db?sslmode=require
#   storage.redis_url         central mode: redis://:password@host:6379/0 (rediss:// for TLS)
#   storage.key               central mode: 64 hex characters (openssl rand -hex 32)
#   proxy.request_hash_salt   optional; central mode derives it from storage.key when unset. If set:
#   embeddings.cache_key      64 hex characters, the same on every replica (a placeholder, or a
#   events.fingerprint_key    replica with other values than a running one, stops the start)
#   provider.<id>.api_key     a provider's API key, referenced as ${secret:provider/<id>/api_key}
apiVersion: v1
kind: Secret
metadata:
  name: maple-proxy
type: Opaque
stringData:
  # One label=token per line; make each token with: openssl rand -hex 24
  # (an example value left in place is refused, so nothing starts with a known token)
  access.proxy_tokens: |
    # laptop=<paste a random token here>
