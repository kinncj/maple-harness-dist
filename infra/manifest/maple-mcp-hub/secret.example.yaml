# EXAMPLE ONLY: the MCP hub's own secrets. Keep the proxy's Secret out of this pod: MCP servers
# are programs the hub runs. Each key is one file under /run/secrets/maple, read-only.
#
#   access.mcp_hub_tokens   label=token per line: the tokens MCP clients send (mcp-hub scope only,
#                           in this pod only). Take a line out to revoke that token: applied within
#                           a minute, without a restart.
#   <name>                  a server's key, referenced in config.yaml as ${secret:<name>}
apiVersion: v1
kind: Secret
metadata:
  name: maple-mcp-hub
type: Opaque
stringData:
  # One label=token per line; make each token with: openssl rand -hex 24
  # (an example value left in place is refused, so the hub never starts with a known token)
  access.mcp_hub_tokens: |
    # laptop=<paste a random token here>
