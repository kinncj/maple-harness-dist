# FOR TRYING IT OUT: one PostgreSQL with no replication and no backups. In production use your
# managed or production PostgreSQL (with backups) and point storage.postgres_dsn at it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_USER, value: maple}
            - {name: POSTGRES_DB, value: maple}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres, key: password}}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "maple", "-d", "maple"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
