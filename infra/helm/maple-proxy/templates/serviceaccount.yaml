{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "maple.serviceAccountName" . }}
  labels:
    {{- include "maple.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The proxy never talks to the Kubernetes API; workload identity webhooks mount their own token.
automountServiceAccountToken: false
{{- end }}
