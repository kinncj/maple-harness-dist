{{- if .Values.networkPolicy.enabled }}
# Only the listed peers reach the proxy's ports; with none listed, nothing does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "maple.fullname" . }}
  labels:
    {{- include "maple.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "maple.selectorLabels" (dict "ctx" . "component" "proxy") | nindent 6 }}
  policyTypes: [Ingress]
  {{- if .Values.networkPolicy.from }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports: [{port: 11535}, {port: 11537}]
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
