# The website for Maple Harness, deployed from the site/ directory of this repository.
#
# This file is a TEMPLATE kept in the private source repository
# (packaging/dist-repo/.github/workflows/pages.yml) and copied here by the source
# repository's "pages" workflow, together with the built site in site/. Do not edit it here.
#
# One-time setup: Settings > Pages > Build and deployment > Source = GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
